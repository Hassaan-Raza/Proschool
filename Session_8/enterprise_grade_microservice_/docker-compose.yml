```
version: '3.8'

# Define the services
services:
  # Service 1: API Gateway
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - service-registry
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/

  # Service 2: Service Registry
  service-registry:
    build: ./service-registry
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=dev

  # Service 3: User Service
  user-service:
    build: ./user-service
    ports:
      - "8081:8081"
    depends_on:
      - service-registry
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/

  # Service 4: Product Service
  product-service:
    build: ./product-service
    ports:
      - "8082:8082"
    depends_on:
      - service-registry
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/

  # Service 5: Order Service
  order-service:
    build: ./order-service
    ports:
      - "8083:8083"
    depends_on:
      - service-registry
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/

  # Service 6: Database
  database:
    image: postgres
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=mydb
    volumes:
      - ./database:/var/lib/postgresql/data

  # Service 7: Test Container
  test-container:
    build: ./test-container
    command: mvn test
    volumes:
      - ./test-container:/app

# Define the networks
networks:
  default:
    driver: bridge

# Define the volumes
volumes:
  database:
```